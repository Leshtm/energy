name: Публикация сборки в релиз

# Сборки лежат в папке builds: APK и рядом файл version-<сборка>.json с
# описанием этой сборки — номер, смысловая версия, ссылка на ассет релиза
# и хеш файла. Воркфлоу сверяет хеш и делает из них GitHub-релиз.
#
# Запуск вручную (workflow_dispatch) с номером сборки. Внешний хостинг для
# этого не нужен: всё нужное лежит в самом репозитории.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Сборка без префикса v, например 0.8.7.55
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Взять сборку и сверить хеш
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cp "builds/energy-${BUILD_VERSION}.apk" energy.apk
          cp "builds/version-${BUILD_VERSION}.json" version.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys

          version = os.environ["BUILD_VERSION"]

          with open("version.json", encoding="utf-8") as f:
              d = json.load(f)

          with open("energy.apk", "rb") as f:
              actual = hashlib.sha256(f.read()).hexdigest()

          if actual != d.get("sha256"):
              sys.exit("APK не совпадает с хешем из version.json: %s != %s"
                       % (actual, d.get("sha256")))

          url = d.get("url", "")
          if "/v%s/" % version not in url:
              sys.exit("ссылка %s указывает не на тег v%s" % (url, version))

          if not str(d.get("versionCode", "")).isdigit():
              sys.exit("versionCode не число: %r" % d.get("versionCode"))

          with open("notes.md", "w", encoding="utf-8") as f:
              f.write((d.get("notes") or "Сборка %s." % version) + "\n\n")
              f.write("Номер сборки %s, файл `energy-%s.apk`.\n"
                      % (d["versionCode"], version))
          PY

      - name: Создать или обновить релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_VERSION: ${{ inputs.version }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${BUILD_VERSION}"
          if gh release view "$tag" --repo "${REPO_SLUG}" >/dev/null 2>&1; then
            # Релиз уже есть — перекладываем файлы поверх, чтобы повторный
            # запуск ничего не ломал и не плодил дублей.
            gh release upload "$tag" energy.apk version.json \
              --repo "${REPO_SLUG}" --clobber
            echo "Релиз $tag уже был — файлы перезалиты."
          else
            gh release create "$tag" energy.apk version.json \
              --repo "${REPO_SLUG}" \
              --title "Энергия ${BUILD_VERSION}" \
              --notes-file notes.md
          fi
