name: Публикация сборки в релиз

# Сборки лежат в папке builds: APK под именем energy-<сборка>.apk.
# Воркфлоу делает из него GitHub-релиз: приложение спрашивает у GitHub API
# последний релиз и берёт оттуда файл сборки, ссылку на него и хеш.
#
# Что изменилось в сборке — вводится при запуске: эта строка попадёт в
# описание релиза, и приложение покажет её в диалоге обновления.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Сборка без префикса v, например 0.8.7.56
        required: true
      notes:
        description: Что изменилось, одной строкой
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Взять сборку
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cp "builds/energy-${BUILD_VERSION}.apk" "energy-${BUILD_VERSION}.apk"

      - name: Создать или обновить релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_VERSION: ${{ inputs.version }}
          REPO_SLUG: ${{ github.repository }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          tag="v${BUILD_VERSION}"
          apk="energy-${BUILD_VERSION}.apk"
          printf '%s\n' "${NOTES}" > notes.md
          if gh release view "$tag" --repo "${REPO_SLUG}" >/dev/null 2>&1; then
            # Релиз уже есть — перекладываем файл и правим описание,
            # чтобы повторный запуск ничего не ломал и не плодил дублей.
            gh release upload "$tag" "$apk" --repo "${REPO_SLUG}" --clobber
            gh release edit "$tag" --repo "${REPO_SLUG}" \
              --title "Энергия ${BUILD_VERSION}" --notes-file notes.md
            echo "Релиз $tag уже был — файл и описание обновлены."
          else
            gh release create "$tag" "$apk" --repo "${REPO_SLUG}" \
              --title "Энергия ${BUILD_VERSION}" --notes-file notes.md
          fi
